# app.glyphh.ai on Fly — the IDENTICAL desktop app on the web (his order,
# 2026-10-04): the full command center, served by web/serve.mjs from the
# desktop renderer's web build (Dockerfile BUILD_SCRIPT=build:web).
#
# Deploys go through GitHub Actions (.github/workflows/deploy-web.yml) — never a
# local `fly deploy`. Naming convention: Fly apps are <org-slug>-<surface>.
# The app name below is a placeholder until the Fly app + DNS exist (his call).
#
# [env] is RUNTIME config: serve.mjs reads process.env and injects these as
# window.__GLYPHH_* before the app boots — the SDK talks DIRECTLY to the API
# (the same server the desktop attaches to), no proxy here. GLYPHH_MOBILE_ONLY
# is deliberately UNSET: a desktop browser gets the command center at /home,
# a phone still gets the mobile shell (web/serve-routes.mjs).
#
# Every web turn runs on a cloud worker through the server's /api/harness/*
# (the SDK's `run({target:"cloud"})`), or on the member's own desktop over the
# attach relay when one is attached (`target:"desktop"`). Terminals ride the
# worker pty (/api/harness/pty); streamed web panels stay behind a flag.

app = "glyphh-ai-app"
primary_region = "iad"

[build.args]
  BUILD_SCRIPT = "build:web"

[env]
  PORT = "3002"
  GLYPHH_SERVER_URL = "https://api.glyphh.ai"
  GLYPHH_GOOGLE_CLIENT_ID = "247280496034-equmvbu3j8qpd5karj7e22f71v6flm1s.apps.googleusercontent.com"
  GLYPHH_WEB_URL = "https://glyphh.ai"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Front door: keep one machine warm — no cold starts at sign-in.
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.http]
    type = "http"
    port = 3002
    # "/" serves the login shell with a 200.
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

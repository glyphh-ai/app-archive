name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    # PINNED, not -latest: the macos-latest image rollout of ~2026-09-05 broke
    # electron-builder's temp signing keychain (SecKeychainUnlock "user name or
    # passphrase not correct") — v1.5.3/v1.5.4 cut no mac installers at all.
    # macos-15 is the image family the last green build (v1.5.2, 2026-09-04) used.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # The lockfile is written by npm 11; node 20 ships npm 10, which
      # resolves the file:../sdk link differently and then rejects its own
      # lockfile ("Missing: esbuild@0.28.2 from lock file" — tsup, a devDep of
      # the SDK that npm 10 pulls into the app tree and npm 11 does not).
      - name: Match the npm the lockfile was written with
        run: npm i -g npm@11

      # Pin Python to 3.11 + ensure setuptools is available. macos-latest
      # ships Python 3.12+, which removed `distutils` from stdlib. node-gyp
      # still imports it during electron-rebuild for native deps that don't
      # have prebuilt x64-darwin binaries (node-pty in particular). Without
      # this the multi-arch build fails on the x64 rebuild pass.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install setuptools (provides distutils for node-gyp)
        run: python3 -m pip install --upgrade setuptools

      # ── Vendor the SDK ──────────────────────────────────────────────
      # package.json depends on `@glyphh/sdk: file:../sdk` — a sibling
      # checkout that exists locally but not in CI. Same self-heal as the
      # platform's deploy workflow: check out sdk@main, build it, and place
      # package.json + dist at ../sdk so the lockfile's link resolves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/sdk
          token: ${{ secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .sdk-src

      - name: Build the SDK (file:../sdk dependency)
        shell: bash
        run: |
          cd .sdk-src
          npm ci
          npm run build
          cd ..
          rm -rf ../sdk
          mkdir -p ../sdk
          cp .sdk-src/package.json ../sdk/package.json
          cp -R .sdk-src/dist ../sdk/dist
          rm -rf .sdk-src

      # ── Bundle the Glyphh CLI ───────────────────────────────────────
      # The app carries the CLI (2026-10-01): cli@main, built against the
      # ../sdk above, into vendor/glyphh-cli, which electron-builder ships
      # as Resources/glyphh-cli. ../cli so its file:../sdk is that same SDK.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/cli
          token: ${{ secrets.CLI_REPO_TOKEN || secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .cli-src

      - name: Install the CLI's dependencies (file:../sdk)
        shell: bash
        run: |
          rm -rf ../cli
          mv .cli-src ../cli
          cd ../cli
          npm ci

      - name: Install dependencies
        run: npm ci

      # THE PURGE: the rrotor harness pod is dead — nothing to vendor.

      - name: Build
        run: npm run build

      - name: Bundle the Glyphh CLI into vendor/glyphh-cli
        run: node scripts/bundle-cli.mjs ../cli

      # electron-builder's asar packer refuses files outside the app dir,
      # and node_modules/@glyphh/sdk is a SYMLINK to ../sdk (outside).
      # Replace the link with a real copy before packaging.
      - name: Materialize @glyphh/sdk (asar cannot follow ../sdk)
        shell: bash
        run: |
          rm -rf node_modules/@glyphh/sdk
          mkdir -p node_modules/@glyphh/sdk
          cp ../sdk/package.json node_modules/@glyphh/sdk/package.json
          cp -R ../sdk/dist node_modules/@glyphh/sdk/dist

      - name: Package macOS (signed + notarized)
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yo-mac
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  build-win:
    # Pinned to windows-2022: the windows-latest image (now windows-2025) ships
    # a Visual Studio layout node-gyp can't detect, so the electron-rebuild of
    # node-pty fails with "Could not find any Visual Studio installation".
    # windows-2022 has the VS2022 C++ toolchain node-gyp finds out of the box.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # The lockfile is written by npm 11; node 20 ships npm 10, which
      # resolves the file:../sdk link differently and then rejects its own
      # lockfile ("Missing: esbuild@0.28.2 from lock file" — tsup, a devDep of
      # the SDK that npm 10 pulls into the app tree and npm 11 does not).
      - name: Match the npm the lockfile was written with
        run: npm i -g npm@11

      # ── Vendor the SDK ──────────────────────────────────────────────
      # package.json depends on `@glyphh/sdk: file:../sdk` — a sibling
      # checkout that exists locally but not in CI. Same self-heal as the
      # platform's deploy workflow: check out sdk@main, build it, and place
      # package.json + dist at ../sdk so the lockfile's link resolves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/sdk
          token: ${{ secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .sdk-src

      - name: Build the SDK (file:../sdk dependency)
        shell: bash
        run: |
          cd .sdk-src
          npm ci
          npm run build
          cd ..
          rm -rf ../sdk
          mkdir -p ../sdk
          cp .sdk-src/package.json ../sdk/package.json
          cp -R .sdk-src/dist ../sdk/dist
          rm -rf .sdk-src

      # ── Bundle the Glyphh CLI ───────────────────────────────────────
      # The app carries the CLI (2026-10-01): cli@main, built against the
      # ../sdk above, into vendor/glyphh-cli, which electron-builder ships
      # as Resources/glyphh-cli. ../cli so its file:../sdk is that same SDK.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/cli
          token: ${{ secrets.CLI_REPO_TOKEN || secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .cli-src

      - name: Install the CLI's dependencies (file:../sdk)
        shell: bash
        run: |
          rm -rf ../cli
          mv .cli-src ../cli
          cd ../cli
          npm ci

      - name: Install dependencies
        run: npm ci

      # THE PURGE: the rrotor harness pod is dead — nothing to vendor.

      - name: Build
        run: npm run build

      - name: Bundle the Glyphh CLI into vendor/glyphh-cli
        run: node scripts/bundle-cli.mjs ../cli

      # electron-builder's asar packer refuses files outside the app dir,
      # and node_modules/@glyphh/sdk is a SYMLINK to ../sdk (outside).
      # Replace the link with a real copy before packaging.
      - name: Materialize @glyphh/sdk (asar cannot follow ../sdk)
        shell: bash
        run: |
          rm -rf node_modules/@glyphh/sdk
          mkdir -p node_modules/@glyphh/sdk
          cp ../sdk/package.json node_modules/@glyphh/sdk/package.json
          cp -R ../sdk/dist node_modules/@glyphh/sdk/dist

      # ── Sign every Windows executable ───────────────────────────────
      # Signing runs INSIDE electron-builder (win.signtoolOptions.sign →
      # scripts/win-sign.cjs), so the app exe, the exes under
      # app.asar.unpacked, the uninstaller and the installer all carry the
      # SSL.com signature, and latest.yml is computed from the signed
      # installer. Until 2026-10-03 this job packed unsigned and signed only
      # Glyphh-Setup.exe afterwards: "Glyphh Desktop.exe" shipped unsigned and
      # Norton flagged it on first launch; the hash refresh step that the
      # after-the-fact signing forced on latest.yml is gone with it.
      #
      # SSL.com's esigner-codesign action ran CodeSignTool on the JDK bundled
      # in the tool's zip — Java 11.0.2 from January 2019, whose trust store
      # predates "SSL.com TLS RSA Root CA 2022". On 2026-09-22 cs.ssl.com began
      # chaining to that root and every sign died with "PKIX path building
      # failed" (v1.1.13, twice; v1.1.12 had passed 13 hours earlier). The
      # action re-extracts the tool on every run, so nothing patched around it
      # survives. Run the same jar ourselves on a maintained Temurin 11 (the
      # windows-2022 toolcache carries it) — same credentials, same config the
      # action wrote.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "11"

      - name: Prepare SSL.com CodeSignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          $zip = "$tool.zip"
          Invoke-WebRequest -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $tool -Force
          $jar = Get-ChildItem $tool -Recurse -Filter "code_sign_tool-*.jar" | Select-Object -First 1
          if (-not $jar) { throw "code_sign_tool jar not found in the CodeSignTool zip" }
          $root = $jar.Directory.Parent.FullName
          # The production endpoints, verbatim what the action wrote to conf/.
          @(
            "CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8",
            "OAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token",
            "CSC_API_ENDPOINT=https://cs.ssl.com",
            "TSA_URL=http://ts.ssl.com",
            "TSA_LEGACY_URL=http://ts.ssl.com/legacy"
          ) | Set-Content -Path (Join-Path $root "conf\code_sign_tool.properties") -Encoding ascii
          java -version 2>&1 | Write-Host
          "CODE_SIGN_TOOL_PATH=$root" | Add-Content -Path $env:GITHUB_ENV
          "CODE_SIGN_TOOL_JAR=$($jar.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Package Windows (signed)
        run: npx electron-builder --win --publish never
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}

      # Fail here, not on a user's machine: every exe in the installer tree and
      # the installer itself must carry a signature.
      - name: Verify every shipped exe is signed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-Item release/Glyphh-Setup.exe) + @(Get-ChildItem release/win-unpacked -Recurse -Filter *.exe)
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Host ("{0,-8} {1}  {2}" -f $sig.Status, $sig.SignerCertificate.Subject, $f.FullName)
            if ($sig.Status -ne "Valid") { $bad += $f.FullName }
          }
          if ($bad.Count) { throw "unsigned or invalid: $($bad -join ', ')" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yo-win
          path: |
            release/*.exe
            release/latest.yml

  build-linux:
    # UBUNTU (2026-08-26). Nothing to sign and nothing to notarize here, so
    # this is the mac/win job minus the whole credential tail. AppImage is the
    # artifact electron-updater can actually update, so Linux rides the same
    # feed as mac/win. (A .deb needs a maintainer email — see
    # electron-builder.yml.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # The lockfile is written by npm 11; node 20 ships npm 10, which
      # resolves the file:../sdk link differently and then rejects its own
      # lockfile ("Missing: esbuild@0.28.2 from lock file" — tsup, a devDep of
      # the SDK that npm 10 pulls into the app tree and npm 11 does not).
      - name: Match the npm the lockfile was written with
        run: npm i -g npm@11

      # ── Vendor the SDK ── same self-heal as the other jobs: package.json
      # depends on `@glyphh/sdk: file:../sdk`, a sibling checkout CI lacks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/sdk
          token: ${{ secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .sdk-src

      - name: Build the SDK (file:../sdk dependency)
        shell: bash
        run: |
          cd .sdk-src
          npm ci
          npm run build
          cd ..
          rm -rf ../sdk
          mkdir -p ../sdk
          cp .sdk-src/package.json ../sdk/package.json
          cp -R .sdk-src/dist ../sdk/dist
          rm -rf .sdk-src

      # ── Bundle the Glyphh CLI ───────────────────────────────────────
      # The app carries the CLI (2026-10-01): cli@main, built against the
      # ../sdk above, into vendor/glyphh-cli, which electron-builder ships
      # as Resources/glyphh-cli. ../cli so its file:../sdk is that same SDK.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glyphh-ai/cli
          token: ${{ secrets.CLI_REPO_TOKEN || secrets.SDK_REPO_TOKEN || secrets.CLIENT_RELEASE_TOKEN }}
          path: .cli-src

      - name: Install the CLI's dependencies (file:../sdk)
        shell: bash
        run: |
          rm -rf ../cli
          mv .cli-src ../cli
          cd ../cli
          npm ci

      - name: Install dependencies
        run: npm ci

      # THE PURGE: the rrotor harness pod is dead — nothing to vendor.

      - name: Build
        run: npm run build

      - name: Bundle the Glyphh CLI into vendor/glyphh-cli
        run: node scripts/bundle-cli.mjs ../cli

      # asar refuses files outside the app dir, and node_modules/@glyphh/sdk
      # is a SYMLINK to ../sdk — replace it with a real copy.
      - name: Materialize @glyphh/sdk (asar cannot follow ../sdk)
        shell: bash
        run: |
          rm -rf node_modules/@glyphh/sdk
          mkdir -p node_modules/@glyphh/sdk
          cp ../sdk/package.json node_modules/@glyphh/sdk/package.json
          cp -R ../sdk/dist node_modules/@glyphh/sdk/dist

      - name: Package Linux (AppImage)
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yo-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: |
            artifacts/yo-mac/*
            artifacts/yo-win/*
            artifacts/yo-linux/*

  mirror-release:
    if: startsWith(github.ref, 'refs/tags/v')
    # Depend only on the builds — NOT the `release` job. A flaky failure
    # creating the (cosmetic) yo-client draft release must not block
    # publishing to the actual update feed.
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Publish to glyphh-releases
        env:
          GH_TOKEN: ${{ secrets.CLIENT_RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Retry — GitHub's release API is intermittently flaky; a single
          # 5xx must not fail the whole release.
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" \
                --repo glyphh-ai/glyphh-releases \
                --title "$TAG" \
                --notes "Glyphh desktop app $TAG" \
                artifacts/yo-mac/*.dmg \
                artifacts/yo-mac/*.zip \
                artifacts/yo-mac/latest-mac.yml \
                artifacts/yo-win/*.exe \
                artifacts/yo-win/latest.yml \
                artifacts/yo-linux/*.AppImage \
                artifacts/yo-linux/latest-linux.yml; then
              echo "Published $TAG to glyphh-releases (attempt $attempt)"
              exit 0
            fi
            # If the release already exists (a re-run), upload the assets to it.
            if gh release view "$TAG" --repo glyphh-ai/glyphh-releases >/dev/null 2>&1; then
              gh release upload "$TAG" --repo glyphh-ai/glyphh-releases --clobber \
                artifacts/yo-mac/*.dmg artifacts/yo-mac/*.zip artifacts/yo-mac/latest-mac.yml \
                artifacts/yo-win/*.exe artifacts/yo-win/latest.yml \
                artifacts/yo-linux/*.AppImage artifacts/yo-linux/latest-linux.yml \
                && { echo "Uploaded assets to existing $TAG"; exit 0; }
            fi
            echo "Publish attempt $attempt failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to publish $TAG to glyphh-releases after 4 attempts"
          exit 1

appId: ai.glyphh.desktop
productName: Glyphh Desktop
copyright: Copyright © 2026 Glyphh AI


mac:
  category: public.app-category.developer-tools
  # Build both Apple Silicon (arm64) and Intel (x64) so users on
  # 2019/2020-era Intel Macs can run Glyphh. ${arch} in artifactName keeps
  # the two variants from colliding on filename.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  artifactName: "Glyphh-${arch}.${ext}"
win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: "Glyphh-Setup.${ext}"
  # EVERY exe is signed through scripts/win-sign.cjs (SSL.com CodeSignTool):
  # the app exe, the exes under app.asar.unpacked, the uninstaller and the
  # installer. Until 2026-10-03 only the installer was signed, after the fact,
  # and Norton flagged the unsigned "Glyphh Desktop.exe" on first launch.
  # sha256 only: the default sha1+sha256 pair calls the hook twice per file,
  # and each call is one eSigner signing against the monthly quota.
  signtoolOptions:
    sign: ./scripts/win-sign.cjs
    signingHashAlgorithms:
      - sha256

# UBUNTU / Linux (2026-08-26). AppImage ONLY, deliberately: it is the one Linux
# format electron-updater can auto-update, so a Linux install rides the SAME
# feed as mac/win (latest-linux.yml). A .deb is a one-line addition here, but
# Debian packaging REQUIRES a maintainer email and package.json's author has
# none — that address ships inside every published package and lands a support
# inbox, so it is a decision to make, not a value to invent. Nothing to sign or
# notarize on this platform.
linux:
  category: Development
  # The 512x512 PNG is what electron-builder wants here; it derives the rest.
  icon: assets/icon.png
  synopsis: The agent workbench
  # x64 here; arm64 is built by its own CI job (his order, 2026-10-07), which
  # overrides this target on the command line (--arm64 -c.linux.target=AppImage)
  # so ONE arch builds per job — listing both here made the arm64 job build
  # x64 as well, and node-pty's x64 rebuild cannot run inside an arm64
  # container. kuzu picks its binary by the HOST's arch, so each arch builds
  # natively. The files are Glyphh-x86_64.AppImage and Glyphh-arm64.AppImage,
  # with latest-linux.yml and latest-linux-arm64.yml as the updater's feeds.
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "Glyphh-${arch}.${ext}"

nsis:
  # Explicit — don't rely on auto-detecting assets/installer.nsh (the running-app
  # check override + VC++ redist install live there).
  include: installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Glyphh
  runAfterFinish: true

# Windows only: fetch the VC++ redistributable into assets/ so the NSIS custom
# script (assets/installer.nsh) can install the runtime kuzu's native module
# needs. No-op on macOS.
beforePack: scripts/before-pack.cjs
# extraResources SILENTLY DROPS node_modules (hardcoded default exclude) — the
# hook copies the vendored pod's deps in after the file-sets ran. Without it
# beta.3 shipped a pod that died on boot (ERR_MODULE_NOT_FOUND: ajv).
afterPack: scripts/after-pack.cjs

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  # kuzu's npm tarball carries its whole C++ source tree and a prebuilt binary
  # for every platform; at runtime it loads only the root kuzujs.node that
  # install.js copied in. Shipping the rest doubled the installer (2026-09-20).
  - "!node_modules/kuzu/kuzu-source/**"
  - "!node_modules/kuzu/prebuilt/**"

# THE GLYPHH CLI SHIPS INSIDE THE APP (2026-10-01): CI bundles cli@main beside
# the sdk@main it vendors (scripts/bundle-cli.mjs → vendor/glyphh-cli: one
# self-contained file, no node_modules). The app runs it with its own binary as
# Node, so no install, and every app update is a CLI + SDK update.
extraResources:
  - from: vendor/glyphh-cli
    to: glyphh-cli

asarUnpack:
  - dist/main/bridge-tui.js
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/koffi/**/*
  - node_modules/kuzu/**/*

# The packaged app-update.yml. The releases repo is private; the server feeds
# the updater (main.ts sets the same URL at runtime). CI publishes with
# --publish never and mirrors the assets itself.
publish:
  provider: generic
  url: https://api.glyphh.ai/api/releases/feed
